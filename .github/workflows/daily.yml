name: daily-prediction

on:
  schedule:
    - cron: '0 15 * * *'  # 23:00 TST — after all lottery draws are published
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/lottery.db
          key: lottery-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lottery-db-${{ runner.os }}-

      - name: Update draw data
        run: |
          mkdir -p data
          for TYPE in 539 649 638 3d 4d; do
            uv run lottery update --type $TYPE
          done

      - name: Train models
        run: |
          for TYPE in 539 649 638 3d 4d; do
            uv run lottery train --type $TYPE --epochs 50
          done

      - name: Generate HTML report
        run: uv run python scripts/generate_report.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
