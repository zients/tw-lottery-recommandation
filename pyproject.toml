[project]
name = "tw-lottery-recommendation"
version = "1.0.6"
description = "Taiwan lottery draw analyzer and number recommender with a Transformer ML model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zients" }]
keywords = ["lottery", "taiwan", "transformer", "machine-learning", "pytorch"]
dependencies = [
    "numpy>=2.4.4",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.urls]
Homepage = "https://zients.github.io/tw-lottery-recommendation/"
Repository = "https://github.com/zients/tw-lottery-recommendation"
Issues = "https://github.com/zients/tw-lottery-recommendation/issues"

[project.scripts]
lottery = "cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper", "analyzer", "data", "ml"]
include = ["cli.py"]
